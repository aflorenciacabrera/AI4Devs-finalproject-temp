[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firmadoc-agent"
version = "0.1.0"
description = "Agente local de Firmadoc: firma hashes con el token del usuario por PKCS#11"
requires-python = ">=3.11"
dependencies = [
    "python-pkcs11>=0.7",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]
build = ["pyinstaller>=6"]

[project.scripts]
firmadoc-agent = "firmadoc_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
