<!-- Contenido del menú lateral: se dibuja fijo en pantallas anchas y dentro de un p-drawer en las angostas. -->
<ng-template #nav>
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"><i class="pi pi-signature"></i></span>
    <span>
      <strong class="brand-name">Firmadoc</strong>
      <span class="brand-sub">Panel Principal</span>
    </span>
  </div>
  <p-menu [model]="menu()" styleClass="sidebar-menu" ariaLabel="Secciones" />
  <div class="sidebar-footer">
    <p-button [icon]="theme.icon()" [label]="theme.label()" [text]="true" severity="secondary" size="small" styleClass="sidebar-action" (onClick)="theme.toggle()" />
    <p-button icon="pi pi-sign-out" label="Cerrar sesión" [text]="true" severity="secondary" size="small" styleClass="sidebar-action" (onClick)="logout()" />
  </div>
</ng-template>

@if (!api.loggedIn()) {
  <main class="login-page">
    <p-button class="login-theme" [icon]="theme.icon()" [text]="true" [rounded]="true" severity="secondary" [ariaLabel]="theme.label()" [title]="theme.label()" (onClick)="theme.toggle()" />
    <app-login />
  </main>
} @else {
  <div class="shell">
    <aside class="sidebar" aria-label="Secciones">
      <ng-container [ngTemplateOutlet]="nav" />
    </aside>

    <div class="shell-main">
      <header class="topbar">
        <p-button id="menu-toggle" icon="pi pi-bars" [text]="true" [rounded]="true" severity="secondary" ariaLabel="Abrir el menú" (onClick)="drawer.set(true)" />
        <h1>Firmadoc</h1>
        <p-button [icon]="theme.icon()" [text]="true" [rounded]="true" severity="secondary" [ariaLabel]="theme.label()" [title]="theme.label()" (onClick)="theme.toggle()" />
      </header>

      <main class="content">
        @switch (tab()) {
          @case ('sign') { <app-sign /> }
          @case ('documents') { <app-documents /> }
          @case ('audit') { <app-audit /> }
          @case ('integrators') { <app-integrators /> }
          @case ('trust') { <app-trust /> }
        }
      </main>
    </div>
  </div>

  <p-drawer [visible]="drawer()" (visibleChange)="drawer.set($event)" position="left" styleClass="sidebar-drawer" ariaCloseLabel="Cerrar el menú" [blockScroll]="true">
    <ng-template #headless>
      <nav class="sidebar-inner" aria-label="Secciones">
        <ng-container [ngTemplateOutlet]="nav" />
      </nav>
    </ng-template>
  </p-drawer>
}

<p-toast position="top-center" />
<!-- Sin la «X» de la cabecera: en PrimeNG 21 ese botón queda sin nombre accesible (p-confirmdialog no le pasa
     `closeAriaLabel` a su p-dialog). El diálogo se cierra con su botón de rechazo o con Escape. -->
<p-confirmdialog header="Confirmar" acceptLabel="Sí" rejectLabel="No" [closable]="false" rejectButtonStyleClass="p-button-text" />
