# Base de datos real de Firmadoc (PostgreSQL). Credenciales por defecto SOLO DE DESARROLLO.
# Guía de conexión (DBeaver) y de migración a la base institucional: docs/database.md
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${FIRMADOC_DB_USER:-firmadoc}
      POSTGRES_PASSWORD: ${FIRMADOC_DB_PASSWORD:-firmadoc}
      POSTGRES_DB: ${FIRMADOC_DB_NAME:-firmadoc}
    ports:
      - "127.0.0.1:5432:5432" # solo accesible desde esta PC
    volumes:
      - firmadoc-pgdata:/var/lib/postgresql/data # los datos sobreviven a `docker compose down`
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  firmadoc-pgdata:
