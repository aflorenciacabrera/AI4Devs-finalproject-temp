[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firmadoc"
version = "0.1.0"
description = "Servicio de firma digital institucional embebible"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "pyhanko>=0.25",
    "pyhanko-certvalidator>=0.26",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4", "playwright>=1.45"]

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
testpaths = ["tests", "agent/tests"]
pythonpath = ["backend/src", "agent/src"]

[tool.ruff]
line-length = 100
src = ["backend/src", "agent/src", "tests", "agent/tests"]
extend-exclude = ["backend/migrations/versions"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]
